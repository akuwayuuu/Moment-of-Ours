<script>(()=>{'use strict';
const $=s=>document.querySelector(s),C=()=>JSON.parse(JSON.stringify(window.CONFIG));
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ── Database (IndexedDB): kv = teks/pengaturan, files = foto/video/lagu dari galeri ── */
const dbp=new Promise((ok,no)=>{try{const r=indexedDB.open('wayu-ayu',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
const tx=(s,m,f)=>dbp.then(d=>new Promise((ok,no)=>{const q=f(d.transaction(s,m).objectStore(s));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k)),keys=s=>tx(s,'readonly',o=>o.getAllKeys());
const urls={};
const K=window.CONFIG.cloud||{},cloud=!!(K.url&&K.key),BK=K.bucket||'media';
const HD={apikey:K.key,...(String(K.key).startsWith('eyJ')?{Authorization:'Bearer '+K.key}:{})};
const local=()=>get('kv','data').catch(()=>null);
window.Hooks={
  load:async()=>{let d=null;
    if(cloud){try{const r=await fetch(`${K.url}/rest/v1/site?id=eq.1&select=data`,{headers:HD,cache:'no-store'});d=(await r.json())[0]?.data;if(d&&Object.keys(d).length)put('kv','data',d).catch(()=>{});else d=null}catch(e){d=null}}
    if(!d)d=await local();return{...C(),...(d||{})}},
  src:async i=>{if(i.emb)return window.embSrc(i.emb);if(!i.fid)return i.url||'';if(urls[i.fid]===undefined){const b=await get('files',i.fid).catch(()=>null);urls[i.fid]=b?URL.createObjectURL(b):''}return urls[i.fid]}
};
navigator.storage?.persist?.();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ov=(h,top)=>{const o=document.createElement('div');o.className='ov';o.style.zIndex=top?95:85;o.innerHTML=`<div class="pn">${h}</div>`;document.body.appendChild(o);return o};
const b2u=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ── Tombol & PIN ── */
const btn=document.createElement('button');btn.className='adm-fab';btn.textContent='Atur Website';document.body.appendChild(btn);
btn.onclick=()=>{
  const o=ov(`<h3>Atur Website</h3><p class="hn c">Masukkan PIN edit</p><div id="ak"></div><div class="ar" style="justify-content:center"><button class="b2" data-x>Batal</button></div>`);
  o.onclick=e=>{if('x' in e.target.dataset||e.target===o)o.remove()};
  window.PinPad(o.querySelector('#ak'),async(p,cb)=>{if(p!==window.CONFIG.editPin)return cb(false);cb(true);curPin=p;o.remove();W=await window.Hooks.load();tab='photos';panel()});
};

/* ── Panel ── */
let W,tab,P,curPin;
const TABS=[['photos','Foto'],['videos','Video'],['songs','Lagu'],['text','Teks'],['bak','Cadangan']];
const F=[['me','Namamu'],['her','Nama pacarmu'],['since','Tanggal jadian','date'],['typed','Kalimat pembuka (1 baris = 1 kalimat)','a'],['letterTo','Salam surat'],['letter','Isi surat (pisahkan paragraf dengan baris kosong)','t'],['letterFrom','Penutup surat'],['timeline','Cerita kita: tanggal | judul | cerita (1 baris = 1 momen)','tl'],['reasons','Alasan aku mencintaimu (1 baris = 1 alasan)','a'],['endTitle','Judul penutup'],['endText','Teks penutup','t'],['endSign','Tanda tangan penutup']];
function panel(){P=ov(`<div class="tb">${TABS.map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('')}</div><div id="pc"></div><div class="ar"><button class="b2" data-act="cancel">Tutup</button><button class="b1" data-act="save">Simpan</button></div>`);
  P.onclick=click;P.oninput=input;draw()}
function draw(){
  P.querySelectorAll('.tb button').forEach(b=>b.classList.toggle('a',b.dataset.tab===tab));let h='';
  if(tab==='text')h=F.map(([k,l,t])=>{const v=t==='a'?(W[k]||[]).join('\n'):t==='tl'?(W[k]||[]).map(x=>`${x.date} | ${x.title} | ${x.desc}`).join('\n'):W[k]||'';
    return`<label>${l}</label>`+(t==='a'||t==='t'||t==='tl'?`<textarea rows="${t==='t'?5:4}" data-k="${k}" data-t="${t}">${E(v)}</textarea>`:`<input ${t?'type="date"':''} data-k="${k}" value="${E(v)}">`)}).join('');
  else if(tab==='bak')h=`<p class="hn">${cloud?'Tersambung ke database online: perubahan muncul di semua perangkat.':'Belum tersambung ke database online (data hanya di browser ini). Isi cloud di bagian atas file.'}</p><p class="hn">Data dari galeri tersimpan di browser perangkat ini. Unduh cadangan untuk memindahkannya ke HP/laptop lain, lalu impor di sana.</p><div class="add"><button class="b1" data-act="exp">Unduh cadangan</button><button class="b2" data-act="imp">Impor cadangan</button><button class="b2" data-act="rst">Kembalikan awal</button></div>`;
  else{const l=tab;h=`<div class="add"><input id="nl" placeholder="Tempel link ${l==='photos'?'foto':l==='videos'?'video':'lagu'} (catbox.moe, dll)"><button class="b2" data-act="addl">+ Link</button><button class="b1" data-act="addf">+ Dari galeri</button></div>`+
    W[l].map((x,i)=>`<div class="rw" data-i="${i}"><div class="fl2">${l==='songs'?`<input data-f="name" placeholder="Judul lagu" value="${E(x.name)}"><input data-f="artist" placeholder="Artis" value="${E(x.artist)}">`:`<input data-f="caption" placeholder="Keterangan" value="${E(x.caption)}">`}<input data-f="url" placeholder="Link" value="${x.emb?'(tertanam di file)':x.fid?'(file dari galeri)':E(x.url)}" ${x.fid||x.emb?'disabled':''}></div><div class="ac"><button data-act="up">↑</button><button data-act="dn">↓</button><button data-act="rm">Hapus</button></div></div>`).join('')||'<p class="hn">Belum ada item.</p>'}
  P.querySelector('#pc').innerHTML=h}
function input(e){const t=e.target,v=t.value;
  if(t.dataset.k){const k=t.dataset.k,y=t.dataset.t;W[k]=y==='a'?v.split('\n').map(s=>s.trim()).filter(Boolean):y==='tl'?v.split('\n').filter(s=>s.trim()).map(s=>{const[d,ti,...r]=s.split('|').map(z=>z.trim());return{date:d||'',title:ti||'',desc:r.join(' | ')}}):v}
  else if(t.dataset.f){W[tab][+t.closest('.rw').dataset.i][t.dataset.f]=v}}
async function click(e){const t=e.target,a=t.dataset.act;
  if(t.dataset.tab){tab=t.dataset.tab;return draw()}
  if(!a)return;const row=t.closest('.rw'),i=row?+row.dataset.i:0,L=W[tab];
  if(a==='cancel')P.remove();
  else if(a==='save')save();
  else if(a==='up'&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];draw()}
  else if(a==='dn'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];draw()}
  else if(a==='rm'){L.splice(i,1);draw()}
  else if(a==='addl'){const u=$('#nl').value.trim();if(!u)return;const it=tab==='songs'?{name:'Lagu baru',artist:'',url:u}:{url:u,caption:''};
    if(tab==='photos')await new Promise(r=>{const im=new Image();im.onload=()=>{it.r=+Math.min(1.8,Math.max(.5,im.width/im.height)).toFixed(3);r()};im.onerror=r;im.src=u});it.r=it.r||.8;if(tab!=='photos')delete it.r;L.push(it);draw()}
  else if(a==='addf'||a==='imp'){const f=document.createElement('input');f.type='file';f.multiple=a==='addf';f.accept=a==='imp'?'.json':tab==='photos'?'image/*':tab==='videos'?'video/*':'audio/*';
    f.onchange=async()=>{for(const file of f.files){if(a==='imp'){const o=JSON.parse(await file.text());for(const k in o.files)await put('files',k,await(await fetch(o.files[k])).blob());W={...C(),...o.data};tab='photos';break}
      if(tab==='photos'){const c=await crop(file);if(!c)continue;L.push({...await sf(c.b,'foto.jpg'),caption:'',r:+Math.min(1.8,Math.max(.5,c.r)).toFixed(3)})}
      else if(tab==='videos')L.push({...await sf(file,file.name),caption:''});
      else L.push({...await sf(file,file.name),name:file.name.replace(/\.[^.]+$/,''),artist:''})}draw()};f.click()}
  else if(a==='exp'){const o={data:W,files:{}};for(const k of await keys('files'))o.files[k]=await b2u(await get('files',k));const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));l.download='cadangan-wayu-ayu.json';l.click()}
  else if(a==='rst'&&confirm('Kembalikan semua isi ke pengaturan awal? (berlaku setelah Simpan)')){W=C();draw()}}
const busy=f=>P&&P.classList.toggle('bz',!!f);
const up=async(b,n)=>{const nm=uid()+'-'+String(n||'f').replace(/[^\w.-]/g,'_');busy(1);
  try{const r=await fetch(`${K.url}/storage/v1/object/${BK}/${nm}`,{method:'POST',headers:{...HD,'Content-Type':b.type||'application/octet-stream'},body:b});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);return`${K.url}/storage/v1/object/public/${BK}/${nm}`}
  catch(e){alert('Upload gagal: '+e.message);throw e}finally{busy(0)}};
const sf=async(b,n)=>{if(cloud)return{url:await up(b,n)};const id=uid();await put('files',id,b);return{fid:id}};
async function save(){
  try{
    if(cloud){busy(1);for(const l of['photos','videos','songs'])for(const x of W[l])if(x.fid){x.url=await up(await get('files',x.fid),x.fid);delete x.fid}
      const r=await fetch(`${K.url}/rest/v1/rpc/save_site`,{method:'POST',headers:{...HD,'Content-Type':'application/json'},body:JSON.stringify({p_pin:curPin,p_data:W})});
      if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);busy(0)}
    await put('kv','data',W);const u=new Set(['photos','videos','songs'].flatMap(l=>W[l].filter(x=>x.fid).map(x=>x.fid)));for(const k of await keys('files'))if(!u.has(k)){await del('files',k);delete urls[k]}}
  catch(e){busy(0);return alert('Gagal menyimpan: '+e.message)}
  P.remove();await window.renderAll()}

/* ── Cropper ── */
function crop(file){return new Promise(res=>{const u=URL.createObjectURL(file);
  const o=ov(`<div class="cw"><img id="ci" src="${u}"></div><div class="tb"><button data-r="1.7778">16:9</button><button data-r="1.5">3:2</button><button data-r="1">1:1</button><button data-r="0.8">4:5</button><button data-r="0">Bebas</button><button data-rot>Putar</button></div><div class="ar"><button class="b2" data-no>Lewati</button><button class="b1" data-ok>Pakai</button></div>`,1);
  const c=new Cropper(o.querySelector('#ci'),{aspectRatio:16/9,viewMode:1,autoCropArea:1,background:false,checkOrientation:true});
  o.onclick=e=>{const t=e.target.dataset;
    if(t.r!==undefined)c.setAspectRatio(+t.r||NaN);else if('rot' in t)c.rotate(90);
    else if('no' in t){c.destroy();o.remove();res(null)}
    else if('ok' in t){const cv=c.getCroppedCanvas({maxWidth:1600,maxHeight:1600});cv.toBlob(b=>{c.destroy();o.remove();URL.revokeObjectURL(u);res({b,r:cv.width/cv.height})},'image/jpeg',.88)}}})}
})();
</script>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=(a,b)=>Math.random()*(b-a)+a;
const H=window.Hooks=Object.assign({load:async()=>JSON.parse(JSON.stringify(window.CONFIG)),src:async i=>i.emb?window.embSrc(i.emb):i.url||''},window.Hooks||{});
const EC={};window.embSrc=async k=>{if(EC[k]===undefined){const d=(window.EMBED||{})[k];if(!d)EC[k]='';else{const[h,b]=d.split(','),n=atob(b),u=new Uint8Array(n.length);for(let i=0;i<n.length;i++)u[i]=n.charCodeAt(i);EC[k]=URL.createObjectURL(new Blob([u],{type:h.slice(5,h.indexOf(';'))}))}}return EC[k]};
const A=new Audio();A.preload='metadata';
let D,cur=0,want=false,tw,tick,pt,used=[];
const mm=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';

/* ── IKON & PIN ── */
const I={heart:'<path d="M12 20s-7.5-4.6-7.5-10.3A4.2 4.2 0 0112 7.2a4.2 4.2 0 017.5 2.5C19.5 15.4 12 20 12 20z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',prev:'<path d="M7 6v12M18 6l-9 6 9 6z"/>',next:'<path d="M17 6v12M6 6l9 6-9 6z"/>',play:'<path d="M8 5.5l11 6.5-11 6.5z"/>',pause:'<path d="M9 6v12M15 6v12"/>',note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',img:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/>',vid:'<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M10.5 9.5l4 2.5-4 2.5z"/>'};
const V=(k,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;
window.PinPad=(root,done)=>{
  let v='';root.innerHTML=`<div class="dots">${'<i></i>'.repeat(6)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'x',0,'ok'].map(k=>`<button data-k="${k}">${k==='x'?V('x'):k==='ok'?V('ok'):k}</button>`).join('')}</div><p class="msg"></p>`;
  const dots=root.querySelector('.dots'),msg=root.querySelector('.msg');
  const paint=()=>dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('f',i<v.length));
  const fin=()=>{if(v.length<6)return;done(v,ok=>{if(ok)return;dots.classList.add('err');msg.textContent='Kode salah, coba lagi';setTimeout(()=>{v='';paint();dots.classList.remove('err');msg.textContent=''},900)})};
  const key=k=>{if(k==='x')v=v.slice(0,-1);else if(k==='ok')return fin();else if(v.length<6)v+=k;paint();if(v.length===6)setTimeout(fin,160)};
  root.onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
  const kh=e=>{if(!root.isConnected)return removeEventListener('keydown',kh);if(!root.getClientRects().length)return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('x');else if(e.key==='Enter')fin()};
  addEventListener('keydown',kh);
};
function pinUI(){
  $('#pin').innerHTML=`<div class="card"><div class="hr">${V('heart')}</div><h1>${E(D.me)} &amp; ${E(D.her)}</h1><p>Masukkan kode rahasia kita</p><div id="pk"></div><p>Petunjuk: tanggal spesial kita</p></div>`;
  $('#pin').addEventListener('pointerdown',()=>{A.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';A.play().catch(()=>{})},{once:true});
  PinPad($('#pk'),(p,cb)=>{if(p===window.CONFIG.pin){cb(true);enter()}else cb(false)});
}
async function enter(){
  $('#pin').classList.add('hidden');await render();
  $('#main').classList.remove('hidden');$('#mfab').classList.remove('hidden');
  want=true;await sel(0,false);play();petals();
}

/* ── RENDER ── */
async function render(){
  D=await H.load();document.title=D.me+' & '+D.her;
  const res=a=>Promise.all((a||[]).map(async x=>({...x,s:await H.src(x)})));
  const [ph,vd]=await Promise.all([res(D.photos),res(D.videos)]);
  const S=(id,l,t,s,x)=>`<section id="${id}"><p class="lbl rv">${l}</p><h2 class="rv">${t}</h2>${s?`<p class="sub rv">${s}</p>`:''}${x}</section>`;
  const paras=D.letter.split(/\n\s*\n/).map(p=>`<p>${E(p)}</p>`).join('');
  $('#main').innerHTML=
`<header id="hero"><p class="lbl">Cerita kita</p><h1><span>${E(D.me)}</span><i>&amp;</i><span>${E(D.her)}</span></h1><div class="rule"></div><div id="tw"></div><p class="dt">${new Date(D.since+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p><p class="lbl" id="cl" style="margin:30px 0 8px"></p><div id="cnt"></div><a class="down" href="#letter" aria-label="Gulir">${V('down')}</a></header>`+
S('letter','Dari hatiku','Surat Untukmu','',`<div class="letter rv"><p class="to">${E(D.letterTo)}</p>${paras}<p class="fr">${E(D.letterFrom)}</p></div>`)+
(ph.length?S('photos','Galeri','Kenangan Kita','Setiap foto menyimpan satu cerita',`<div class="gal">${ph.map((p,i)=>`<div class="ph rv" style="--rot:${((i%5)-2)*1.8}deg"><div class="im" data-a="lb" data-i="${i}" style="aspect-ratio:${p.r||.8}">${p.s?`<img src="${E(p.s)}" alt="${E(p.caption)}" loading="lazy">`:V('img')}</div><p>${E(p.caption)}</p></div>`).join('')}</div>`):'')+
(vd.length?S('videos','Rekaman','Momen yang Bergerak','',`<div class="gal v">${vd.map(v=>`<div class="ph rv" style="--rot:0deg"><div class="im" style="aspect-ratio:16/9;cursor:default">${v.s?`<video src="${E(v.s)}" controls playsinline preload="metadata"></video>`:V('vid')}</div><p>${E(v.caption)}</p></div>`).join('')}</div>`):'')+
((D.timeline||[]).length?S('story','Perjalanan','Cerita Kita','',`<div class="tl">${D.timeline.map(t=>`<div class="it card rv"><small>${E(t.date)}</small><h3>${E(t.title)}</h3><p>${E(t.desc)}</p></div>`).join('')}</div>`):'')+
((D.songs||[]).length?S('music','Playlist','Lagu Kita','Lagu-lagu yang selalu mengingatkanku padamu',`<div class="pl card rv"><div class="vin"></div><h3 id="tn">—</h3><div class="ty" id="ta"></div><div class="bar" data-a="sk"><i id="pg"></i></div><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div><div class="ctl"><button data-a="pv" aria-label="Sebelumnya">${V('prev',1)}</button><button class="pp" id="pp" data-a="pp" aria-label="Putar">${V('play',1)}</button><button data-a="nx" aria-label="Berikutnya">${V('next',1)}</button></div></div><div class="list rv">${D.songs.map((s,i)=>`<div data-a="tr" data-i="${i}"><span>${i+1}</span><span>${E(s.name)}${s.artist?' · '+E(s.artist):''}</span></div>`).join('')}</div>`):'')+
((D.reasons||[]).length?S('why','Dari hati ke hati','Alasan Aku Mencintaimu','Ketuk tombol untuk membaca satu alasan',`<button class="btn rv" data-a="rs">Ambil satu alasan</button><div class="note card" id="nt">${V('heart')}</div>`):'')+
`<section id="end"><h2 class="rv">${E(D.endTitle)}</h2><p class="rv">${E(D.endText)}</p><div class="sg rv">${E(D.endSign)}</div></section>`;
  counter();typer();reveal();
}
function counter(){
  clearInterval(tick);const s=new Date(D.since+'T00:00:00');
  $('#cl').textContent=Date.now()<s?'Menuju hari kita':'Sudah bersama selama';
  const f=()=>{let d=Math.abs(Date.now()-s);$('#cnt').innerHTML=[['Hari',864e5],['Jam',36e5],['Menit',6e4],['Detik',1e3]].map(([n,m])=>{const v=Math.floor(d/m);d-=v*m;return`<div><b>${v}</b><small>${n}</small></div>`}).join('')};
  f();tick=setInterval(f,1000);
}
function typer(){
  clearTimeout(tw);const L=D.typed||[],el=$('#tw');if(!L.length||!el)return;let i=0,c=0,del=0;
  (function s(){const t=L[i];el.textContent=t.slice(0,c);
    if(!del){if(++c>t.length){del=1;return tw=setTimeout(s,2200)}tw=setTimeout(s,65)}
    else{if(--c<0){del=0;c=0;i=(i+1)%L.length;return tw=setTimeout(s,400)}tw=setTimeout(s,30)}})();
}
function reveal(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');o.unobserve(e.target)}}),{threshold:.1});$$('.rv').forEach(e=>o.observe(e))}
function petals(){clearInterval(pt);pt=setInterval(()=>{if(document.hidden)return;const p=document.createElement('i'),z=R(8,15);p.className='fl';p.style.cssText=`left:${R(0,100)}%;width:${z}px;height:${z*1.4}px;--dx:${R(-90,90)}px;animation-duration:${R(11,19)}s;background:rgba(255,${Math.floor(R(150,205))},${Math.floor(R(180,220))},.5)`;document.body.appendChild(p);p.onanimationend=()=>p.remove()},1500)}

/* ── MUSIK ── */
function ui(){const p=!A.paused;if($('#pp'))$('#pp').innerHTML=V(p?'pause':'play',!p);$('.pl')?.classList.toggle('on',p);$('#mfab').classList.toggle('on',p)}
async function sel(i,go){
  const s=D.songs||[];if(!s.length)return;cur=(i+s.length)%s.length;const t=s[cur];
  $('#tn')&&($('#tn').textContent=t.name||'Tanpa judul');$('#ta')&&($('#ta').textContent=t.artist||'');
  $$('.list div').forEach((e,j)=>e.classList.toggle('a',j===cur));
  const u=await H.src(t);if(!u){A.removeAttribute('src');A.load();return ui()}
  A.src=u;go?play():ui();
}
function play(){if(A.getAttribute('src'))A.play().then(ui).catch(()=>{})}
function pause(){A.pause();ui()}
A.onended=()=>sel(cur+1,true);A.onplay=A.onpause=ui;
A.ontimeupdate=()=>{if($('#pg'))$('#pg').style.width=(A.duration?A.currentTime/A.duration*100:0)+'%';$('#t1')&&($('#t1').textContent=mm(A.currentTime));$('#t2')&&($('#t2').textContent=mm(A.duration))};
$('#mfab').innerHTML=V('note');$('#mfab').onclick=()=>A.paused?play():pause();

/* ── INTERAKSI ── */
function reason(){
  if(used.length>=D.reasons.length)used=[];
  const l=D.reasons.map((_,i)=>i).filter(i=>!used.includes(i)),i=l[Math.floor(R(0,l.length))];used.push(i);
  const n=$('#nt');n.style.opacity=0;setTimeout(()=>{n.textContent=D.reasons[i];n.style.transition='opacity .5s';n.style.opacity=1},200);
}
function lightbox(i){const p=D.photos[i];H.src(p).then(u=>{if(!u)return;$('#lb').innerHTML=`<img src="${E(u)}" alt=""><p>${E(p.caption)}</p>`;$('#lb').classList.remove('hidden')})}
$('#lb').onclick=()=>$('#lb').classList.add('hidden');
$('#main').addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
  if(a==='pp')A.paused?play():pause();else if(a==='pv')sel(cur-1,!A.paused);else if(a==='nx')sel(cur+1,!A.paused);
  else if(a==='tr')sel(i,true);else if(a==='lb')lightbox(i);else if(a==='rs')reason();
  else if(a==='sk'&&A.duration){const r=t.getBoundingClientRect();A.currentTime=(e.clientX-r.left)/r.width*A.duration}
});
$('#main').addEventListener('play',e=>{if(e.target.tagName==='VIDEO')pause()},true);
window.renderAll=async()=>{const p=!A.paused;await render();await sel(Math.min(cur,Math.max((D.songs||[]).length-1,0)),p)};

/* ── MULAI ── */
(async()=>{
  D=await H.load();pinUI();setTimeout(()=>{$('#pin').classList.remove('hidden');$('#load').classList.add('hidden')},1600);
  addEventListener('pointerdown',()=>{if(want&&A.paused)play()},{once:true});
})();
})();
</script></body></html>
